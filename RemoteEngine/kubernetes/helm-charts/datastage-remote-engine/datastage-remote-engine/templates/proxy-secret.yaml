{{- if .Values.proxyUrl }}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    meta.helm.sh/release-name: {{ .Values.name }}
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: ibm-cpd-datastage-remote-operator
  name: datastage-proxy-url
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  proxy_url: {{ .Values.proxyUrl | b64enc }}
  {{- if .Values.caCert }}
---
apiVersion: v1
kind: Secret
metadata:
  name: connection-ca-certs
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  ca.crt: {{ .Values.caCert | b64enc }}
  {{- end }}
{{- end }}
